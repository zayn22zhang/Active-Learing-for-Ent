[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "al4qed"
version = "0.2.0"
description = "Reproducible active learning of quantum separability visibility"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "joblib>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
ml = ["torch>=2.1", "cvxpy>=1.4"]
ohst = ["juliacall>=0.9"]
dev = ["pytest>=7"]

[project.scripts]
al4qed-train = "al4qed.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
al4qed = ["*.jl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
